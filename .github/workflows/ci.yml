# CI — every push and PR runs the same gates: types, lint, tests, build.
# The build uses a placeholder DATABASE_URL: pages that need the DB are
# force-dynamic and don't touch it at build time.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: node --import tsx --test tests/*.test.ts

      - name: Production build
        run: npx next build 2>&1 | tee build.log
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"

      - name: No oversized data-cache entries
        run: |
          if grep -q "items over 2MB can not be cached" build.log; then
            echo "::error::Build produced an unstable_cache value over 2MB (see docs/PRODUCT_DECISIONS.md #7)"
            exit 1
          fi
